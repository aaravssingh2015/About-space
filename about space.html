<body>
    <script>
        let div = document.createElement('div');
        div.id = "paragraph";
        div.className = "alert";
        div.innerHTML = "<h1>About our solar system  </h1>";
        let div1 = document.createElement('div');
        div1.innerHTML = "<p>The solar system consists of the Sun at its center and everything bound to it by gravity, including eight planets, their moons, and countless asteroids and comets. The inner solar system contains four rocky terrestrial planets—Mercury, Venus, Earth, and Mars—separated from the outer giants by an asteroid belt. The outer solar system features four massive planets: the gas giants Jupiter and Saturn, and the ice giants Uranus and Neptune. Located in the Orion Arm of the Milky Way galaxy, our solar system relies on the Sun's immense mass to keep all celestial bodies moving in their respective orbits. According to NASA Science, this system formed roughly 4.6 billion years ago.</p>";

        document.body.append(div1);
